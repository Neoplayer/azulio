# ---------------------------------------------------------------------------
# Azul — docker-compose.yml
# Run the backend server (and optionally Redis) via Docker.
#
# Usage:
#   docker compose up --build          # build + start
#   docker compose up -d --build       # detached
#   docker compose down                # stop + remove containers
# ---------------------------------------------------------------------------

services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    expose:
      - "8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Web frontend (nginx): serves the SPA and proxies /api + /ws to `server`.
  # This is the public entry point — reachable on host port 80.
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    # Host binding is configurable so the stack can sit behind an existing
    # reverse proxy. Defaults to publishing on host port 80 for a standalone
    # deploy; override via WEB_PORT (e.g. WEB_PORT=127.0.0.1:8088).
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - server
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis (optional, for future persistence / pub-sub).
  # Uncomment when RedisRoomRepository is implemented (see DESIGN §6).
  # ---------------------------------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped
