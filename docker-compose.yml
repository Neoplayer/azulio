# ---------------------------------------------------------------------------
# Azul — docker-compose.yml
# Run the backend server (and optionally Redis) via Docker.
#
# Usage:
#   docker compose up --build          # build + start
#   docker compose up -d --build       # detached
#   docker compose down                # stop + remove containers
# ---------------------------------------------------------------------------

services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis (optional, for future persistence / pub-sub).
  # Uncomment when RedisRoomRepository is implemented (see DESIGN §6).
  # ---------------------------------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped
