# Azul Online — host reverse proxy to the Dockerized web container on :8088.
# default_server so the app is reachable by raw IP; named vhosts are unaffected.
# Installed to /etc/nginx/sites-available/azul and symlinked into sites-enabled
# by scripts/deploy.sh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/azul.access.log;
    error_log  /var/log/nginx/azul.error.log;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
