# ---------------------------------------------------------------------------
# nginx config for the Azul web frontend.
# Serves the static SPA and proxies API + WebSocket traffic to the backend,
# so the browser talks to a single origin (matches wsUrl() = location.host/ws).
# ---------------------------------------------------------------------------

upstream azul_backend {
    server server:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API → Fastify backend.
    location /api/ {
        proxy_pass http://azul_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket → Fastify (ws) backend.
    location /ws {
        proxy_pass http://azul_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — let the client router handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
