[workspace]
resolver = "3"
members = ["crates/shared", "crates/engine", "crates/server"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
azul-shared = { path = "crates/shared" }
azul-engine = { path = "crates/engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
