# Cargo configuration for the Azul Rust workspace.
#
# ts-rs writes the generated TypeScript wire types to the directory below when
# the `export_bindings_*` tests run (i.e. `cargo test -p azul-shared`). The path
# is relative to this file's parent directory (azul-server/), so it resolves to
# packages/web/src/generated/ in the monorepo. The web client imports those
# generated types; the Rust `azul-shared` crate is their single source of truth.
[env]
TS_RS_EXPORT_DIR = { value = "../packages/web/src/generated", relative = true }
